name: Compile examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        typst: [v0.15.1, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install official Typst release
        env:
          GH_TOKEN: ${{ github.token }}
          TYPST_RELEASE: ${{ matrix.typst }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TYPST_RELEASE" == latest ]]; then
            metadata=$(gh api repos/typst/typst/releases/latest --jq '.assets[] | select(.name == "typst-x86_64-unknown-linux-musl.tar.xz") | [.browser_download_url, .digest] | @tsv')
            IFS=$'\t' read -r url digest <<< "$metadata"
          else
            url="https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz"
            digest="sha256:a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
          fi
          [[ "$url" == https://github.com/typst/typst/releases/download/*/typst-x86_64-unknown-linux-musl.tar.xz ]]
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$RUNNER_TEMP/typst.tar.xz"
          printf '%s  %s\n' "${digest#sha256:}" "$RUNNER_TEMP/typst.tar.xz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/typst"
          tar --extract --xz --file "$RUNNER_TEMP/typst.tar.xz" --directory "$RUNNER_TEMP/typst" --strip-components=1
          echo "$RUNNER_TEMP/typst" >> "$GITHUB_PATH"

      - name: Compile every example
        run: python3 scripts/check-examples.py
